<!doctype html>
<html lang="th" data-theme="white-cube">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>หอศิลป์ออนไลน์</title>
  <meta name="description" content="นิทรรศการศิลปะออนไลน์ ที่กำลังจัดแสดง กำลังจะมา และนิทรรศการที่ผ่านมา">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/base.css">
  <script type="module" src="/js/lobby.js"></script>
</head>
<body>
  <a class="sr-only" href="#main" data-i18n="skip">ข้ามไปเนื้อหา</a>
  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="/" id="site-name">หอศิลป์ออนไลน์</a>
      <nav class="nav" aria-label="เมนูหลัก" data-i18n-aria="mainMenu" id="site-nav">
        <a href="#now" data-i18n="navNow">กำลังจัดแสดง</a>
        <a href="#past" data-i18n="navPast">นิทรรศการที่ผ่านมา</a>
        <a href="/login" data-i18n="navStaff">สำหรับผู้จัด</a>
      </nav>
      <span id="lang"></span>
    </div>
  </header>
  <main id="main" class="wrap">
    <section class="lobby-hero">
      <p class="eyebrow">Online Gallery</p>
      <h1 data-i18n="lobbyHeadline">หอศิลป์ที่เปิดทุกนิทรรศการไว้ในที่เดียว</h1>
      <p class="muted" style="max-width:56ch" data-i18n="lobbyLead">เลือกชมนิทรรศการที่กำลังจัดแสดง ส่งผลงานเข้าร่วมงานที่เปิดรับ หรือย้อนดูนิทรรศการที่ผ่านมา</p>
    </section>
    <section id="now" aria-labelledby="now-title">
      <h2 class="section-title" id="now-title" data-i18n="nowTitle">กำลังจัดแสดงและเปิดรับผลงาน</h2>
      <div class="ex-grid" id="now-list"><p class="muted" data-i18n="loading">กำลังโหลด…</p></div>
    </section>
    <section id="past" aria-labelledby="past-title">
      <h2 class="section-title" id="past-title" data-i18n="pastTitle">นิทรรศการที่ผ่านมา</h2>
      <div class="ex-grid" id="past-list"></div>
    </section>
  </main>
  <footer class="site-foot"><div class="wrap" id="foot"></div></footer>
</body>
</html>
